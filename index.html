<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050711">
  <meta name="description" content="Gestione prestiti carte del team F.P.T">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <!-- La lista profili del login arriva da una RPC Supabase: aprire subito
       DNS/TCP/TLS verso l'API (in parallelo al download di app.js) evita di
       pagarli alla prima chiamata. crossorigin: le fetch di Supabase sono CORS. -->
  <link rel="preconnect" href="https://gonycawupahawocqafcf.supabase.co" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Cinzel disegna il titolo "F.P.T CARDS" del login, che è l'elemento LCP:
       preload, altrimenti il titolo aspetta il font a bassa priorità
       (misurato: LCP 4,69 s con prefetch, 4,23 s con preload). -->
  <link rel="preload" href="assets/fonts/cinzel-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <!--
    Critical launch CSS: deve rendere il primo frame di #app-launch identico
    allo splash nativo Android/PWA (stesso sfondo, stesso logo centrato,
    nessun testo) SENZA dipendere da styles.css, che può arrivare qualche
    millisecondo dopo. Le regole di css/app-launch.css usano l'id per
    completare la scena e rivelarla quando il bootstrap è in corso.
  -->
  <style>
    html,body{background:#050711}
    .app-launch{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;overflow:hidden;background:#050711;opacity:1}
    .launch-arcane{position:absolute;inset:0;opacity:0}
    .app-launch-mark{grid-area:1/1;position:relative;z-index:1;width:clamp(84px,24vw,128px);height:clamp(84px,24vw,128px);object-fit:contain}
  </style>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/app-launch.css">
  <link rel="preload" href="assets/loading/blattaman-arcane.webp" as="image">
  <title>F.P.T Cards</title>
</head>
<body>
  <script>
    // Guard di bootstrap immediato per i link di raccolta condivisa: marca
    // subito la pagina come "share" (prima ancora che app.js — un modulo
    // grande — venga scaricato/eseguito), così qualunque regola CSS o
    // controllo futuro scritto su body[data-page] vede il confine pubblico/
    // privato fin dal primissimo istante, mai un istante dopo. Nessuna
    // logica duplicata: app.js resta l'unica sorgente di verità su COSA
    // renderizzare, questo script tocca solo l'attributo, mai il DOM di #app.
    if (/^#\/share\/[0-9a-f-]{36}$/i.test(location.hash)) document.body.dataset.page = 'share';
  </script>
  <div id="app-launch" class="app-launch" role="status" aria-label="Avvio F.P.T. Cards">
    <img class="app-launch-mark" src="icon-384.webp" alt="" fetchpriority="high" width="384" height="384">
    <div class="launch-arcane">
      <div class="launch-top"><strong>F.P.T. CARDS</strong><span class="launch-live"><i aria-hidden="true"></i>RISVEGLIO IN CORSO</span></div>
      <div class="launch-rule" aria-hidden="true"></div>
      <div class="launch-title"><span class="launch-eyebrow">L’ARCHIVIO SI RISVEGLIA</span><h2>La tua collection<br><em>in un’app</em></h2><p class="launch-battlecry">YEAH BABY LES GOH!</p></div>
      <div class="launch-stage" aria-hidden="true">
        <div class="launch-aura"></div><div class="launch-orbit"></div><div class="launch-orbit launch-orbit-alt"></div>
        <div class="launch-storm" data-launch-storm></div>
        <div class="launch-mascot"><img src="assets/loading/blattaman-arcane.webp" alt="" width="640" height="498" data-launch-mascot></div>
        <div class="launch-particles" data-launch-particles></div><div class="launch-floor"></div>
      </div>
      <div class="launch-progress"><div class="launch-caption"><p data-launch-status>Preparazione del tuo spazio…</p><span class="launch-wait" aria-hidden="true">AVVIO</span></div><div class="launch-track" aria-hidden="true"><i></i></div></div>
      <div class="launch-footer"><strong>TRADE · TRUST · TRIUMPH</strong><span>IL PATTO È IL TEAM</span></div>
    </div>
  </div>
  <script src="js/app-launch.js"></script>
  <noscript><style>#app-launch { display:none; }</style></noscript>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
  <script type="module">
    // Web Vitals solo in debug (?debugPerf=1): senza il flag non si scarica nulla.
    if (new URLSearchParams(location.search).get('debugPerf') === '1') import('./js/performance-vitals.js').then(m => m.startPerformanceVitals()).catch(error => console.warn('[perf] web-vitals non disponibile', error));
  </script>
</body>
</html>
